# ===============================
# CONFIGURA합ES DO BANCO DE DADOS (H2 para desenvolvimento)
# ===============================
spring.datasource.url=jdbc:h2:mem:greenlogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# CONFIGURA합ES JPA/HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non-contextual-creation=true

# ===============================
# H2 CONSOLE (para visualiza豫o do banco)
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=true
spring.h2.console.settings.web-allow-others=true

# ===============================
# CONFIGURA합ES DO SERVIDOR
# ===============================
server.port=8080
server.servlet.context-path=/

# ===============================
# CONFIGURA합ES DE LOGGING
# ===============================
logging.level.com.lixo.gerenciamento=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# DEVTOOLS (desenvolvimento)
# ===============================
spring.devtools.restart.enabled=true
spring.devtools.add-properties=true

# ===============================
# CONFIGURA합ES DE CORS
# ===============================
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true


# Chave secreta de 256 bits em Base64 (Gerada especificamente para evitar erros de Weak Key e Decoder)
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
