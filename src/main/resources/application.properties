# ===============================
# CONFIGURAÇÕES DO BANCO DE DADOS (H2 para desenvolvimento)
# ===============================
spring.datasource.url=jdbc:h2:mem:greenlogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# CONFIGURAÇÕES JPA/HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non-contextual-creation=true

# ===============================
# H2 CONSOLE (para visualização do banco)
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=true
spring.h2.console.settings.web-allow-others=true

# ===============================
# CONFIGURAÇÕES DO SERVIDOR
# ===============================
server.port=8080
server.servlet.context-path=/

# ===============================
# CONFIGURAÇÕES DE LOGGING
# ===============================
logging.level.com.lixo.gerenciamento=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# DEVTOOLS (desenvolvimento)
# ===============================
spring.devtools.restart.enabled=true
spring.devtools.add-properties=true

# ===============================
# CONFIGURAÇÕES DA APLICAÇÃO
# ===============================
app.roteamento.velocidade-media-kmph=40.0
app.roteamento.tempo-coleta-por-ponto-minutos=6.0
app.roteamento.tempo-carga-descarga-minutos=10.0
app.roteamento.distancia-padrao-fallback-km=5.0
app.config.garagem-bairro-id=1
app.config.algoritmos-roteamento=DIJKSTRA
app.config.max-pontos-por-rota=20

# ===============================
# CONFIGURAÇÕES DE CORS
# ===============================
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true


# ===============================
# CONFIGURAÇÕES JWT
# ===============================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400 # 24 horas em segundos
jwt.refresh-expiration=604800 # 7 dias em segundos

# ===============================
# SEGURANÇA
# ===============================
security.require-ssl=false

# ===============================
# USUÁRIO ADMIN PADRÃO
# ===============================
app.admin.email=admin@greenlog.com
app.admin.senha=Admin123!
app.admin.nome=Administrador do Sistema